<!doctype html><meta charset="utf-8"><title>OpenAI OAuth zstd</title><style>body{font:14px system-ui;padding:16px;color:#222}label{display:block;margin:12px 0}button{padding:7px 14px}</style><h3>OpenAI OAuth zstd</h3><label><input id="enabled" type="checkbox"> 启用压缩</label><label>压缩级别 <input id="level" type="number" min="1" max="22" value="3"></label><label><input id="fallback" type="checkbox" checked> 不兼容时允许明文回退</label><button id="save">保存</button><script>let cfg={enabled:true,level:3,fallback_uncompressed:true};const send=(type,p={})=>parent.postMessage({source:'sub2api.plugin',type,request_id:crypto.randomUUID(),...p},'*');addEventListener('message',e=>{if(e.data?.type==='config.loaded'){cfg=e.data.config||cfg;enabled.checked=cfg.enabled;level.value=cfg.level;fallback.checked=cfg.fallback_uncompressed}});send('sub2api.plugin.ready');send('config.load');save.onclick=()=>send('config.save',{config:{enabled:enabled.checked,level:+level.value,fallback_uncompressed:fallback.checked}})</script>
