name: build-plugin

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Configure signing key
        env:
          SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            umask 077
            printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/plugin-signing-key.pem"
            echo "PLUGIN_SIGNING_KEY_FILE=$RUNNER_TEMP/plugin-signing-key.pem" >> "$GITHUB_ENV"
          fi
      - name: Require signing key for production release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
        run: test -n "$SIGNING_KEY"
      - run: go test -race ./...
      - name: Build installable plugin package
        env:
          PLUGIN_VERSION: 0.2.${{ github.run_number }}
          PLUGIN_SIGNING_KEY_ID: ${{ vars.PLUGIN_SIGNING_KEY_ID || 'milesians' }}
        run: ./build.sh
      - name: Export signing public key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
        run: |
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/plugin-signing-key.pem"
          openssl pkey -in "$RUNNER_TEMP/plugin-signing-key.pem" -pubout \
            -out dist/plugin-signing-key-public.pem
          {
            echo 'key_id: milesians'
            echo 'public_key: |'
            sed 's/^/  /' dist/plugin-signing-key-public.pem
          } > dist/plugin-publisher.txt
      - name: Verify package structure
        run: python3 tools/verify_package.py dist/sub2api-plugin-zstd.s2plugin
      - uses: actions/upload-artifact@v4
        with:
          name: sub2api-plugin-zstd-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sub2api-plugin-zstd-${{ github.sha }}
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v0.2.${{ github.run_number }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/sub2api-plugin-zstd.s2plugin dist/plugin-signing-key-public.pem dist/plugin-publisher.txt --clobber
          else
            gh release create "$RELEASE_TAG" dist/sub2api-plugin-zstd.s2plugin dist/plugin-signing-key-public.pem dist/plugin-publisher.txt \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
